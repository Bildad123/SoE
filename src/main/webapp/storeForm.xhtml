<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	 xmlns="http://www.w3.org/1999/xhtml"
          xmlns:f="jakarta.faces.core"
          xmlns:h="jakarta.faces.html"
          xmlns:ui="jakarta.faces.facelets"
          xmlns:faces="jakarta.faces"
          xmlns:pt="jakarta.faces.passthrough">

   <ui:composition template="Layouts/template.xhtml">
      <ui:define name="content">

         <h:form id="create-Store-form">
            <fieldset>
               <legend>#{storeForm.operation}</legend>

               <h:outputLabel for="storeName" value="Store Name"></h:outputLabel>
               <h:inputText id="storeName" value="#{storeForm.storeName}" required="true" label="Name"
                            styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0"
                            readonly="#{storeForm.operation.equals('Delete Store') || storeForm.operation.equals('Read Store')}"
                            disabled="#{storeForm.operation.equals('Delete Store') || storeForm.operation.equals('Read Store')}"
               />
               <br/><br/><hr style="width: 100%; border: 1px solid #dddddd"></hr><br></br>

               <h:outputLabel for="phone" value="Phone"></h:outputLabel>
               <h:inputText id="phone" value="#{storeForm.phone}" required="true" label="Name"
                            styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0"
                            readonly="#{storeForm.operation.equals('Delete Store') || storeForm.operation.equals('Read Store')}"
                            disabled="#{storeForm.operation.equals('Delete Store') || storeForm.operation.equals('Read Store')}"
               />
               <br/><br/><hr style="width: 100%; border: 1px solid #dddddd"></hr><br></br>

               <h:outputLabel for="email" value="Email"></h:outputLabel>
               <h:inputText id="email" value="#{storeForm.email}" required="true" label="Name"
                            styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0"
                            readonly="#{storeForm.operation.equals('Delete Store') || storeForm.operation.equals('Read Store')}"
                            disabled="#{storeForm.operation.equals('Delete Store') || storeForm.operation.equals('Read Store')}"
               />
               <br/><br/><hr style="width: 100%; border: 1px solid #dddddd"></hr><br></br>

               <h:outputLabel for="state" value="State"></h:outputLabel>
               <h:inputText id="state" value="#{storeForm.state}" required="true" label="Name"
                            styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0"
                            readonly="#{storeForm.operation.equals('Delete Store') || storeForm.operation.equals('Read Store')}"
                            disabled="#{storeForm.operation.equals('Delete Store') || storeForm.operation.equals('Read Store')}"
               />
               <br/><br/>

               <h:outputLabel for="city" value="City"></h:outputLabel>
               <h:inputText id="city" value="#{storeForm.city}" required="true" label="Name"
                            styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0"
                            readonly="#{storeForm.operation.equals('Delete Store') || storeForm.operation.equals('Read Store')}"
                            disabled="#{storeForm.operation.equals('Delete Store') || storeForm.operation.equals('Read Store')}"
               />
               <br/><br/><hr style="width: 100%; border: 1px solid #dddddd"></hr><br></br>

               <h:outputLabel for="street" value="Street"></h:outputLabel>
               <h:inputText id="street" value="#{storeForm.street}" required="true" label="Name"
                            styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0"
                            readonly="#{storeForm.operation.equals('Delete Store') || storeForm.operation.equals('Read Store')}"
                            disabled="#{storeForm.operation.equals('Delete Store') || storeForm.operation.equals('Read Store')}"
               />
               <br/><br/><hr style="width: 100%; border: 1px solid #dddddd"></hr><br></br>

               <h:outputLabel for="zipCode" value="Zip Code"></h:outputLabel>
               <h:inputText id="zipCode" value="#{storeForm.zipCode}" required="true" label="Name"
                            styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0"
                            readonly="#{storeForm.operation.equals('Delete Store') || storeForm.operation.equals('Read Store')}"
                            disabled="#{storeForm.operation.equals('Delete Store') || storeForm.operation.equals('Read Store')}"
               />
               <br/><br/>

            </fieldset>
            <br/><br/>
            <h:commandButton id="reset"  value="Reset" action="#{storeForm.submitForm()}"
                             style="width: 100%" pt:type="reset"
                             rendered="#{storeForm.operation.equals('Create Store')}"
            />
            <br/><br/>

            <h:commandButton id="submit" type="submit" value="#{storeForm.operation}" action="#{storeForm.submitForm()}"
                             style="width: 100%"
                             rendered="#{!storeForm.operation.equals('Read Store')}"
            />
            <br/><br/>

         </h:form>

      </ui:define>
   </ui:composition>
</html>
