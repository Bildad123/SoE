<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	xmlns="http://www.w3.org/1999/xhtml"
         xmlns:f="http://xmlns.jcp.org/jsf/core"
         xmlns:h="http://xmlns.jcp.org/jsf/html"
         xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="Layouts/template.xhtml">
   <ui:define name="content">
      <span style="font-size: small">Showing #{allOrders.orders.size()} orders(s) in the database</span><br></br>
      <h:form>
         <h:dataTable value="#{meineBackingBean.meineDatenListe}" var="loopElement">
            <h:column>
               <f:facet name="header"><h:outputText value="Auswahl"></h:outputText></f:facet>
               <h:selectBooleanCheckbox value="#{meineBackingBean.merkerMap[ loopElement ]}" />
            </h:column>
            <h:column>
               <f:facet name="header"><h:outputText value="ID"></h:outputText></f:facet>
               <h:outputText value="#{loopElement.id}" />
            </h:column>
            <h:column>
               <f:facet name="header"><h:outputText value="Firstname"></h:outputText></f:facet>
               <h:outputText value="#{loopElement.firstname}" />
            </h:column>
            <h:column>
               <f:facet name="header"><h:outputText value="Lastname"></h:outputText></f:facet>
               <h:outputText value="#{loopElement.lastname}" />
            </h:column>
            <h:column>
               <f:facet name="header"><h:outputText value="Email"></h:outputText></f:facet>
               <h:outputText value="#{loopElement.email}"/>
            </h:column>
            <h:column>
               <f:facet name="header"><h:outputText value="Zip"></h:outputText></f:facet>
               <h:outputText value="#{loopElement.zip}"/>
            </h:column>
            <h:column>
               <f:facet name="header"><h:outputText value="Street"></h:outputText></f:facet>
               <h:outputText value="#{loopElement.street}"/>
            </h:column>
            <h:column>
               <f:facet name="header"><h:outputText value="Aktion"></h:outputText></f:facet>
               <h:commandButton value="Element &auml;ndern" action="#{meineBackingBean.einzelnesElementEditieren}">
                  <f:setPropertyActionListener target="#{meineBackingBean.einzelnesElement}" value="#{loopElement}" />
               </h:commandButton>
            </h:column>
         </h:dataTable>
         <h:outputText value="&lt;br/&gt;" escape="false" />
         <h:commandButton value="Markierte Elemente l&ouml;schen" action="#{meineBackingBean.markierteElementeLoeschen}" />
         <h:outputText value="&nbsp;&nbsp;&nbsp;" />
         <h:commandButton value="Neues Element erstellen" action="#{meineBackingBean.neuesElementErstellen}" />
      </h:form>

   </ui:define>
</ui:composition>

</html>
