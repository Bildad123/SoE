<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	 xmlns="http://www.w3.org/1999/xhtml"
          xmlns:f="jakarta.faces.core"
          xmlns:h="jakarta.faces.html"
          xmlns:ui="jakarta.faces.facelets"
          xmlns:faces="jakarta.faces"
          xmlns:pt="jakarta.faces.passthrough">


<ui:composition template="Layouts/template.xhtml">

    <ui:define name="content">
        <h:outputLabel style="font-size: small" id="matched-brands">Matched #{allBrands.filteredBrands.size()} brand(s) in the database</h:outputLabel><br></br>
        <h:form autocomplete="off">
            <div style="display: flex; flex-direction: row; justify-content:space-between; align-items: center;" >
                <h:inputText pt:type="text" pt:placeholder="Search for Brand by Brand Name"  id="search-text" value="#{allBrands.searchText}" styleClass="form-search-text-input" >
                    <f:ajax event="keyup" listener="#{allBrands.keypress()}" render="data-table-brands matched-brands" execute="@this"/>
                </h:inputText>

                <h:link value="&#10133;  Create Brand" styleClass="data-table-create-h-link" outcome="brandForm.xhtml"></h:link>
            </div>

            <h:panelGroup id="data-table-brands">
            <h:dataTable value="#{allBrands.filteredBrands}" var="b"
                         id="data-table"
                         first="#{allBrands.pagination.currentRows}"
                         rows="#{allBrands.pagination.maxTableRows}"
                         styleClass="customers-table"
                         headerClass="customers-table-header"
                         rowClasses="customers-table-odd-row,customers-table-even-row"
                         cellspacing="15px"
                         cellpadding="15px"
                         style="text-align: left"
                         rendered="#{allBrands.filteredBrands.size() > 0}">

                <h:column>
                    <f:facet name="header">Brand Name</f:facet>
                    <h:link value="#{b.brandName}" outcome="brandForm.xhtml">
                        <f:param name="id" value="#{b.id}" />
                        <f:param name="operation" value="Read"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header"><h:outputText value="Action"></h:outputText></f:facet>

                    <h:link value="&#x274C;" outcome="brandForm.xhtml" styleClass="data-table-edit-h-link">
                        <f:param name="id" value="#{b.id}" />
                        <f:param name="operation" value="Delete"/>
                    </h:link>
                </h:column>


                <f:facet name="footer">
                    <h:panelGroup rendered="#{allBrands.pagination.showPageList}">
                        <h:commandButton value="Back" action="#{allBrands.pagination.back}" disabled="#{!allBrands.pagination.displayBackButton}" styleClass="form-paginating-button-back" />
                        <h:selectOneMenu value="#{allBrands.pagination.selectedPage}">
                            <f:selectItems value="#{allBrands.pagination.pages}" var="Page" itemLabel="Seite #{page}" itemValue="#{page}" />
                            <f:ajax listener="#{allBrands.pagination.pageChange}" render="@form"/>
                        </h:selectOneMenu>
                        <h:commandButton value="Next" action="#{allBrands.pagination.next}" disabled="#{!allBrands.pagination.displayNextButton}" styleClass="form-paginating-button-next" />
                    </h:panelGroup>
                </f:facet>
            </h:dataTable>
            </h:panelGroup>
        </h:form>

    </ui:define>
</ui:composition>

</html>
