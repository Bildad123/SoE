<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 		xmlns="http://www.w3.org/1999/xhtml"
             xmlns:f="http://xmlns.jcp.org/jsf/core"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:h = "http://xmlns.jcp.org/jsf/html"
             xmlns:jsf = "http://xmlns.jcp.org/jsf">

<ui:composition template="Layouts/template.xhtml">


   <ui:define name="content">
      <span style="font-size: small">Showing #{allOrders.orders.size()} orders(s) in the database</span><br></br>
      <h:form>

         <div style="display: flex; flex-direction: row; justify-content:space-between; align-items: center;" >
            <input type="text" placeholder="Search for Customer" jsf:id="serch_text" jsf:value="#{allCustomers.searchText}"  class="form-search-text-input" >
                  <f:ajax event="keyup" listener="#{allCustomers.keypress()}" render="data-table qty" execute="@this"/>
            </input>


            <h:link value="&#10133;  Create Customer" styleClass="data-table-create-h-link" outcome="customerForm.xhtml"></h:link>



         </div>



         <h:dataTable value="#{allCustomers.filteredCustomers}" var="c"
                      id="data-table"
                      first="#{allCustomers.pagination.currentRows}"
                      rows="#{allCustomers.pagination.maxTableRows}"
                      styleClass="customers-table"
                      headerClass="customers-table-header"
                      rowClasses="customers-table-odd-row,customers-table-even-row"
                      cellspacing="15px"
                      cellpadding="15px"
                      style="text-align: left"
                      rendered="#{allCustomers.filteredCustomers.size() > 0}">

            <h:column>
               <f:facet name="header">Fullname</f:facet>
               <h:link value="#{c.firstname} #{c.lastname}" outcome="customerForm.xhtml">
                  <f:param name="id" value="#{c.id}" />
                  <f:param name="operation" value="Read"/>
               </h:link>

            </h:column>

            <h:column>
               <f:facet name="header">Email</f:facet>
               #{c.email}

            </h:column>

            <h:column>
               <f:facet name="header">Address</f:facet>
               #{c.zip}, #{c.street}
            </h:column>
            <h:column>
               <f:facet name="header"><h:outputText value="Action"></h:outputText></f:facet>

               <h:link value="&#128221;" outcome="customerForm.xhtml" styleClass="data-table-edit-h-link">
                  <f:param name="id" value="#{c.id}" />
                  <f:param name="operation" value="Edit"/>
               </h:link>

               <h:link value="&#x274C;" outcome="customerForm.xhtml" styleClass="data-table-edit-h-link">
                  <f:param name="id" value="#{c.id}" />
                  <f:param name="operation" value="Delete"/>
               </h:link>

            </h:column>

            <f:facet name="footer">
               <h:panelGroup rendered="#{allCustomers.pagination.showPageList}">
                  <h:commandButton value="Back" action="#{allCustomers.pagination.back}" disabled="#{!allCustomers.pagination.displayBackButton}" styleClass="form-paginating-button-back" />
                  <h:selectOneMenu value="#{allCustomers.pagination.selectedPage}">
                     <f:selectItems value="#{allCustomers.pagination.pages}" var="page" itemLabel="Page #{page}" itemValue="#{page}" />
                     <f:ajax listener="#{allCustomers.pagination.pageChange}" render="@form"/>
                  </h:selectOneMenu>
                  <h:commandButton value="Next" action="#{allCustomers.pagination.next}" disabled="#{!allCustomers.pagination.displayNextButton}" styleClass="form-paginating-button-next" />


               </h:panelGroup>
            </f:facet>
         </h:dataTable>
      </h:form>

   </ui:define>
</ui:composition>

</html>
