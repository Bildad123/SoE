<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	xmlns="http://www.w3.org/1999/xhtml"
         xmlns:f="http://xmlns.jcp.org/jsf/core"
         xmlns:h="http://xmlns.jcp.org/jsf/html"
         xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="Layouts/template.xhtml">
  <ui:define name="content">

    <h2><h:outputText value="Einzelnes Element editieren" /></h2>
    <h:messages style="color: red" />
    <h:form>
      <h:panelGrid columns="2">
        <h:outputText value="ID" />
        <h:inputText  label="ID"          value="#{meineBackingBean.einzelnesElement.id}" disabled="true" />
        <h:outputText value="Firstname" />
        <h:inputText  label="Firstname" value="#{meineBackingBean.einzelnesElement.firstname}" />

        <h:outputText value="Lastname" />
        <h:inputText  label="Lastname" value="#{meineBackingBean.einzelnesElement.lastname}" />

        <h:outputText value="Email" />
        <h:inputText  label="Email" value="#{meineBackingBean.einzelnesElement.email}" />

        <h:outputText value="Street" />
        <h:inputText  label="Street" value="#{meineBackingBean.einzelnesElement.street}" />


        <h:outputText value="Zip" />
        <h:inputText  label="Zip" value="#{meineBackingBean.einzelnesElement.zip}" />


      </h:panelGrid>
      <h:commandButton value="Speichern" action="#{meineBackingBean.einzelnesElementSpeichern}" />
      <h:commandButton value="Abbrechen" action="tabelle.xhtml" immediate="true" />
    </h:form>

  </ui:define>
</ui:composition>

</html>
