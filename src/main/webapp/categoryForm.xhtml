<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	 xmlns="http://www.w3.org/1999/xhtml"
          xmlns:f="jakarta.faces.core"
          xmlns:h="jakarta.faces.html"
          xmlns:ui="jakarta.faces.facelets"
          xmlns:faces="jakarta.faces"
          xmlns:pt="jakarta.faces.passthrough">

   <ui:composition template="Layouts/template.xhtml">
      <ui:define name="content">

         <h:form id="create-Category-form">
            <fieldset>
               <legend>#{categoryForm.operation}</legend>

               <h:outputLabel for="categoryName" value="Category Name"></h:outputLabel>
               <h:inputText id="categoryName" value="#{categoryForm.categoryName}" required="true" label="Name"
                            readonly="#{categoryForm.operation.equals('Delete Category') || categoryForm.operation.equals('Read Category')}"
                            disabled="#{categoryForm.operation.equals('Delete Category') || categoryForm.operation.equals('Read Category')}"
                            styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0; font: inherit; font-size: small"/>
               <br/><br/>


            </fieldset><br></br>
            <h:commandButton id="reset"  value="Reset" action="#{categoryForm.submitForm()}"
                             style="width: 100%" pt:type="reset"
                             rendered="#{categoryForm.operation.equals('Create Category')}"
            />
            <br/><br/>

            <h:commandButton id="submit" type="submit" value="#{categoryForm.operation}" action="#{categoryForm.submitForm()}"
                             style="width: 100%"
                             rendered="#{!categoryForm.operation.equals('Read Category')}"
            />
            <br/><br/>

         </h:form>

      </ui:define>
   </ui:composition>
</html>
