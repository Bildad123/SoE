<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	 xmlns="http://www.w3.org/1999/xhtml"
         xmlns:f="http://xmlns.jcp.org/jsf/core"
         xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
         xmlns:h = "http://xmlns.jcp.org/jsf/html"
         xmlns:jsf = "http://xmlns.jcp.org/jsf">


<ui:composition template="Layouts/template.xhtml">
    <ui:define name="header">
        <ui:insert name="header">
            <ui:include src="header.xhtml"></ui:include>
        </ui:insert>
        <f:metadata>
            <f:viewAction action="#{allStores.pagination.doRefresh}" />
        </f:metadata>

    </ui:define>
    <ui:define name="content">
        <h:outputLabel style="font-size: small" id="qty">Matched #{allStores.filteredStores.size()} store(s) in the database</h:outputLabel><br></br>
        <h:form onsubmit="return false" autocomplete="off">
            <input type="text" placeholder="Search for Stores" jsf:id="serch_text" jsf:value="#{allStores.searchText}"  class="form-search-text-input" >
                <f:ajax event="keyup" listener="#{allStores.keypress()}" render="data-table qty" execute="@this"/>
            </input>

            <h:dataTable value="#{allStores.filteredStores}" var="s"
                         id="data-table"
                         first="#{allStores.pagination.currentRows}"
                         rows="#{allStores.pagination.maxTableRows}"
                         styleClass="customers-table"
                         headerClass="customers-table-header"
                         rowClasses="customers-table-odd-row,customers-table-even-row"
                         cellspacing="15px"
                         cellpadding="15px"
                         style="text-align: left"
                         rendered="#{allStores.filteredStores.size() > 0}">

                <h:column>
                    <f:facet name="header">Store Name</f:facet>
                    #{s.storeName}
                </h:column>

                <h:column>
                    <f:facet name="header">Phone</f:facet>
                    #{s.phone}
                </h:column>

                <h:column>
                    <f:facet name="header">Email</f:facet>
                    #{s.email}
                </h:column>

                <h:column>
                    <f:facet name="header">Street</f:facet>
                    #{s.street}
                </h:column>

                <h:column>
                    <f:facet name="header">Zip Code</f:facet>
                    #{s.zipCode}
                </h:column>


                <f:facet name="footer">
                    <h:panelGroup rendered="#{allStores.pagination.showPageList}">
                        <h:commandButton value="Back" action="#{allStores.pagination.back}" disabled="#{!allStores.pagination.displayBackButton}" styleClass="form-paginating-button-back" />
                        <h:selectOneMenu value="#{allStores.pagination.selectedPage}">
                            <f:selectItems value="#{allStores.pagination.pages}" var="Page" itemLabel="Seite #{page}" itemValue="#{page}" />
                            <f:ajax listener="#{allStores.pagination.pageChange}" render="@form"/>
                        </h:selectOneMenu>
                        <h:commandButton value="Next" action="#{allStores.pagination.next}" disabled="#{!allStores.pagination.displayNextButton}" styleClass="form-paginating-button-next" />
                    </h:panelGroup>
                </f:facet>
            </h:dataTable>
        </h:form>

    </ui:define>
</ui:composition>

</html>
