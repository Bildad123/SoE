<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	 xmlns="http://www.w3.org/1999/xhtml"
          xmlns:f="http://xmlns.jcp.org/jsf/core"
          xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
          xmlns:h = "http://xmlns.jcp.org/jsf/html"
          xmlns:jsf = "http://xmlns.jcp.org/jsf"
          xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">


<ui:composition template="Layouts/template.xhtml">

    <ui:define name="content">
        <h:outputLabel style="font-size: small" id="matched-stores">Matched #{allStores.filteredStores.size()} store(s) in the database</h:outputLabel><br></br>
        <h:form autocomplete="off">
            <div style="display: flex; flex-direction: row; justify-content:space-between; align-items: center;" >
                <h:inputText pt:type="text" pt:placeholder="Search for Store by Store Name"  id="search-text" value="#{allStores.searchText}" styleClass="form-search-text-input" >
                    <f:ajax event="keyup" listener="#{allStores.keypress()}" render="data-table-stores matched-stores" execute="@this"/>
                </h:inputText>

                <h:link value="&#10133;  Create Store" styleClass="data-table-create-h-link" outcome="storeForm.xhtml"></h:link>
            </div>

            <h:panelGroup id="data-table-stores">
            <h:dataTable value="#{allStores.filteredStores}" var="s"
                         id="data-table"
                         first="#{allStores.pagination.currentRows}"
                         rows="#{allStores.pagination.maxTableRows}"
                         styleClass="customers-table"
                         headerClass="customers-table-header"
                         rowClasses="customers-table-odd-row,customers-table-even-row"
                         cellspacing="15px"
                         cellpadding="15px"
                         style="text-align: left"
                         rendered="#{allStores.filteredStores.size() > 0}">

                <h:column>
                    <f:facet name="header">Store Name</f:facet>
                    <h:link value="#{s.storeName}" outcome="storeForm.xhtml">
                        <f:param name="id" value="#{s.id}" />
                        <f:param name="operation" value="Read"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Phone</f:facet>
                    <h:link value="#{s.phone}" outcome="storeForm.xhtml">
                        <f:param name="id" value="#{s.id}" />
                        <f:param name="operation" value="Read"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Email</f:facet>
                    <h:link value="#{s.email}" outcome="storeForm.xhtml">
                        <f:param name="id" value="#{s.id}" />
                        <f:param name="operation" value="Read"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">State</f:facet>
                    <h:link value="#{s.state}" outcome="storeForm.xhtml">
                        <f:param name="id" value="#{s.id}" />
                        <f:param name="operation" value="Read"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">City</f:facet>
                    <h:link value="#{s.city}" outcome="storeForm.xhtml">
                        <f:param name="id" value="#{s.id}" />
                        <f:param name="operation" value="Read"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Street</f:facet>
                    <h:link value="#{s.street}" outcome="storeForm.xhtml">
                        <f:param name="id" value="#{s.id}" />
                        <f:param name="operation" value="Read"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Zip Code</f:facet>
                    <h:link value="#{s.zipCode}" outcome="storeForm.xhtml">
                        <f:param name="id" value="#{s.id}" />
                        <f:param name="operation" value="Read"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header"><h:outputText value="Action"></h:outputText></f:facet>

                    <h:link value="&#128221;" outcome="storeForm.xhtml" styleClass="data-table-edit-h-link">
                        <f:param name="id" value="#{s.id}" />
                        <f:param name="operation" value="Edit"/>
                    </h:link>

                    <h:link value="&#x274C;" outcome="storeForm.xhtml" styleClass="data-table-edit-h-link">
                        <f:param name="id" value="#{s.id}" />
                        <f:param name="operation" value="Delete"/>
                    </h:link>
                </h:column>


                <f:facet name="footer">
                    <h:panelGroup rendered="#{allStores.pagination.showPageList}">
                        <h:commandButton value="Back" action="#{allStores.pagination.back}" disabled="#{!allStores.pagination.displayBackButton}" styleClass="form-paginating-button-back" />
                        <h:selectOneMenu value="#{allStores.pagination.selectedPage}">
                            <f:selectItems value="#{allStores.pagination.pages}" var="Page" itemLabel="Seite #{page}" itemValue="#{page}" />
                            <f:ajax listener="#{allStores.pagination.pageChange}" render="@form"/>
                        </h:selectOneMenu>
                        <h:commandButton value="Next" action="#{allStores.pagination.next}" disabled="#{!allStores.pagination.displayNextButton}" styleClass="form-paginating-button-next" />
                    </h:panelGroup>
                </f:facet>
            </h:dataTable>
            </h:panelGroup>
        </h:form>

    </ui:define>
</ui:composition>

</html>
