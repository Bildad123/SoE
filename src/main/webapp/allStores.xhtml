<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	xmlns="http://www.w3.org/1999/xhtml"
         xmlns:f="http://xmlns.jcp.org/jsf/core"
         xmlns:h="http://xmlns.jcp.org/jsf/html"
         xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="Layouts/template.xhtml">
    <ui:define name="header">
        <ui:insert name="header">
            <ui:include src="header.xhtml"></ui:include>
        </ui:insert>
        <f:metadata>
            <f:viewAction action="#{allStores.doRefresh}" />
        </f:metadata>

    </ui:define>
    <ui:define name="content">
        <span style="font-size: small">Showing #{allStores.stores.size()} store(s) in the database</span><br></br>
        <h:form>
            <h:dataTable value="#{allStores.stores}" var="s"
                         first="#{allStores.currentRows}"
                         rows="#{allStores.maxTblRows}"
                         styleClass="customers-table"
                         headerClass="customers-table-header"
                         rowClasses="customers-table-odd-row,customers-table-even-row"
                         cellspacing="15px"
                         cellpadding="15px"
                         style="text-align: left"
                         rendered="#{allStores.stores.size() > 0}">

                <h:column>
                    <f:facet name="header">Store Name</f:facet>
                    #{s.storeName}
                </h:column>

                <h:column>
                    <f:facet name="header">Phone</f:facet>
                    #{s.phone}
                </h:column>

                <h:column>
                    <f:facet name="header">Email</f:facet>
                    #{s.email}
                </h:column>

                <h:column>
                    <f:facet name="header">Street</f:facet>
                    #{s.street}
                </h:column>

                <h:column>
                    <f:facet name="header">Zip Code</f:facet>
                    #{s.zipCode}
                </h:column>




                <f:facet name="footer">
                    <h:panelGroup rendered="#{allStores.showPageList}">
                        <h:commandButton value="Zurueck" action="#{allStores.zurueck}" rendered="#{allStores.displayZurueckBtn}" styleClass="footerBtn" />
                        <h:selectOneMenu value="#{allStores.selectedPage}">
                            <f:selectItems value="#{allStores.pages}" var="page" itemLabel="Seite #{page}" itemValue="#{page}" />
                            <f:ajax listener="#{allStores.pageChange}" render="@form"/>
                        </h:selectOneMenu>
                        <h:commandButton value="Weiter" action="#{allStores.weiter}" rendered="#{allStores.displayWeiterBtn}" styleClass="footerBtn" />
                    </h:panelGroup>
                </f:facet>
            </h:dataTable>
        </h:form>

    </ui:define>
</ui:composition>

</html>
