<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	xmlns="http://www.w3.org/1999/xhtml"
         xmlns:f="http://xmlns.jcp.org/jsf/core"
         xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
         xmlns:h = "http://xmlns.jcp.org/jsf/html"
         xmlns:jsf = "http://xmlns.jcp.org/jsf">

<ui:composition template="Layouts/template.xhtml">
    <ui:define name="content">
        <h:outputLabel style="font-size: small" id="qty">Matched #{allStocks.filteredStocks.size()} stocks(s) in the database</h:outputLabel><br></br>
        <h:form onsubmit="return false" autocomplete="off" >
            <input type="text" placeholder="Search for Stocks" jsf:id="serch_text" jsf:value="#{allStocks.searchText}" class="form-search-text-input" >
                <f:ajax event="keyup" listener="#{allStocks.keypress()}" render="data-table qty" execute="@this"/>
            </input>
            <h:dataTable value="#{allStocks.filteredStocks}" var="s"
                         id="data-table"
                         first="#{allStocks.pagination.currentRows}"
                         rows="#{allStocks.pagination.maxTableRows}"
                         styleClass="customers-table"
                         headerClass="customers-table-header"
                         rowClasses="customers-table-odd-row,customers-table-even-row"
                         cellspacing="15px"
                         cellpadding="15px"
                         style="text-align: left"
                         rendered="#{allStocks.filteredStocks.size() > 0}">

                <h:column>
                    <f:facet name="header">Product</f:facet>
                    #{s.product.name}
                </h:column>

                <h:column>
                    <f:facet name="header">Quantity</f:facet>
                    #{s.quantity}
                </h:column>

                <h:column>
                    <f:facet name="header">Store</f:facet>
                    #{s.store.storeName}
                </h:column>

                <f:facet name="footer">
                    <h:panelGroup rendered="#{allStocks.pagination.showPageList}">
                        <h:commandButton value="Back" action="#{allStocks.pagination.back}" disabled="#{!allStocks.pagination.displayBackButton}" styleClass="form-paginating-button-back" />
                        <h:selectOneMenu value="#{allStocks.pagination.selectedPage}">
                            <f:selectItems value="#{allStocks.pagination.pages}" var="page" itemLabel="Page #{page}" itemValue="#{page}" />
                            <f:ajax listener="#{allStocks.pagination.pageChange}" render="@form"/>
                        </h:selectOneMenu>
                        <h:commandButton value="Next" action="#{allStocks.next}" disabled="#{!allStocks.pagination.displayNextButton}" styleClass="form-paginating-button-next" />
                    </h:panelGroup>
                </f:facet>
            </h:dataTable>
        </h:form>

    </ui:define>
</ui:composition>

</html>
