<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	xmlns="http://www.w3.org/1999/xhtml"
         xmlns:f="http://xmlns.jcp.org/jsf/core"
         xmlns:h="http://xmlns.jcp.org/jsf/html"
         xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="Layouts/template.xhtml">
    <ui:define name="header">
        <ui:insert name="header">
            <ui:include src="header.xhtml"></ui:include>
        </ui:insert>
        <f:metadata>
            <f:viewAction action="#{allStocks.pagination.doRefresh}" />
        </f:metadata>

    </ui:define>
    <ui:define name="content">
        <span style="font-size: small">Showing #{allStocks.stocks.size()} stocks(s) in the database</span><br></br>
        <h:form>
            <h:dataTable value="#{allStocks.stocks}" var="s"
                         first="#{allStocks.pagination.currentRows}"
                         rows="#{allStocks.pagination.maxTableRows}"
                         styleClass="customers-table"
                         headerClass="customers-table-header"
                         rowClasses="customers-table-odd-row,customers-table-even-row"
                         cellspacing="15px"
                         cellpadding="15px"
                         style="text-align: left"
                         rendered="#{allStocks.stocks.size() > 0}">

                <h:column>
                    <f:facet name="header">Product</f:facet>
                    #{s.product.name}
                </h:column>

                <h:column>
                    <f:facet name="header">Quantity</f:facet>
                    #{s.quantity}
                </h:column>

                <h:column>
                    <f:facet name="header">Store</f:facet>
                    #{s.store.storeName}
                </h:column>

                <f:facet name="footer">
                    <h:panelGroup rendered="#{allStocks.pagination.showPageList}">
                        <h:commandButton value="Back" action="#{allStocks.pagination.back}" disabled="#{!allStocks.pagination.displayBackButton}" styleClass="form-paginating-button-back" />
                        <h:selectOneMenu value="#{allStocks.pagination.selectedPage}">
                            <f:selectItems value="#{allStocks.pagination.pages}" var="page" itemLabel="Seite #{page}" itemValue="#{page}" />
                            <f:ajax listener="#{allStocks.pagination.pageChange}" render="@form"/>
                        </h:selectOneMenu>
                        <h:commandButton value="Next" action="#{allStocks.next}" disabled="#{!allStocks.pagination.displayNextButton}" styleClass="form-paginating-button-next" />
                    </h:panelGroup>
                </f:facet>
            </h:dataTable>
        </h:form>

    </ui:define>
</ui:composition>

</html>
