<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	 xmlns="http://www.w3.org/1999/xhtml"
          xmlns:f="jakarta.faces.core"
          xmlns:h="jakarta.faces.html"
          xmlns:ui="jakarta.faces.facelets"
          xmlns:faces="jakarta.faces"
          xmlns:pt="jakarta.faces.passthrough">

<ui:composition template="Layouts/template.xhtml">
    <ui:define name="content">
        <h:outputLabel style="font-size: small" id="matched-stocks">Matched #{allStocks.filteredStocks.size()} stocks(s) in the database</h:outputLabel><br></br>
        <h:form autocomplete="off" >
            <h:inputText pt:type="text" pt:placeholder="Search for Stocks" id="search_text" value="#{allStocks.searchText}"  styleClass="form-search-text-input" >
                <f:ajax event="keyup" listener="#{allStocks.keypress()}" render="data-table-stocks matched-stocks" execute="@this"/>
            </h:inputText>
            <h:panelGroup id="data-table-stocks">
            <h:dataTable value="#{allStocks.filteredStocks}" var="s"
                         id="data-table"
                         first="#{allStocks.pagination.currentRows}"
                         rows="#{allStocks.pagination.maxTableRows}"
                         styleClass="customers-table"
                         headerClass="customers-table-header"
                         rowClasses="customers-table-odd-row,customers-table-even-row"
                         cellspacing="15px"
                         cellpadding="15px"
                         style="text-align: left"
                         rendered="#{allStocks.filteredStocks.size() > 0}">

                <h:column>
                    <f:facet name="header">Product</f:facet>
                    #{s.product.name}
                </h:column>

                <h:column>
                    <f:facet name="header">Quantity</f:facet>
                    #{s.quantity}
                </h:column>

                <h:column>
                    <f:facet name="header">Store</f:facet>
                    #{s.store.storeName}
                </h:column>

                <f:facet name="footer">
                    <h:panelGroup rendered="#{allStocks.pagination.showPageList}">
                        <h:commandButton value="Back" disabled="#{!allStocks.pagination.displayBackButton}" styleClass="form-paginating-button-back">
                            <f:ajax listener="#{allStocks.pagination.back()}" render="@form"/>
                        </h:commandButton>
                        <h:selectOneMenu value="#{allStocks.pagination.selectedPage}">
                            <f:selectItems value="#{allStocks.pagination.pages}" var="page" itemLabel="Page #{page}" itemValue="#{page}" />
                            <f:ajax listener="#{allStocks.pagination.pageChange}" render="@form"/>
                        </h:selectOneMenu>
                        <h:commandButton value="Next" disabled="#{!allStocks.pagination.displayNextButton}" styleClass="form-paginating-button-next">
                            <f:ajax listener="#{allStocks.pagination.next()}" render="@form"/>
                        </h:commandButton>
                    </h:panelGroup>
                </f:facet>
            </h:dataTable>
            </h:panelGroup>
        </h:form>

    </ui:define>
</ui:composition>

</html>
