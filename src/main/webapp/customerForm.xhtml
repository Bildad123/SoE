<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:jsf="http://xmlns.jcp.org/jsf"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

    <ui:composition template="Layouts/template.xhtml">

        <ui:define name="content">

            <h:form id="create-customer-form">
                <fieldset>
                    <legend>Create Customer</legend>
                    <br/>


                    <h:outputLabel for="firstname" value="First Name"  styleClass="form-label"/>
                    <h:inputText id="firstname" value="#{customerForm.firstName}" required="true"
                                 styleClass="form-input-text"

                    />
                    <br/><br/>

                    <h:outputLabel for="lastname" value="Last Name" styleClass="form-label"/>
                    <h:inputText id="lastname" value="#{customerForm.lastName}" required="true" styleClass="form-input-text"
                    />
                    <br/><br/>


                    <h:outputLabel for="email" value="Email"  styleClass="form-label"/>
                    <h:inputText id="email" type="email" value="#{customerForm.email}" required="true"
                                 styleClass="form-input-text"
                    />
                    <br/><br/>

                    <h:outputLabel for="phone" value="Phone"  styleClass="form-label"/>
                    <h:inputText id="phone" value="#{customerForm.phone}" required="true"
                                 styleClass="form-input-text"
                    />
                    <br/><br/>


                    <h:outputLabel for="zip" value="Zip Code"  styleClass="form-label"/>
                    <h:inputText id="zip" value="#{customerForm.zip}" required="true"
                                 styleClass="form-input-text"
                    />
                    <br/><br/>

                    <h:outputLabel for="state" value="State"  styleClass="form-label"/>
                    <h:inputText id="state" value="#{customerForm.state}" required="true"
                                 styleClass="form-input-text"
                    />
                    <br/><br/>

                    <h:outputLabel for="street" value="Street"  styleClass="form-label"/>
                    <h:inputText id="street" value="#{customerForm.street}" required="true"
                                 styleClass="form-input-text"
                    />
                    <br/><br/><br/>

                </fieldset>
                <br/><br/>
                <h:commandButton id="reset"  value="reset" action="#{customerForm.submitForm()}"
                                 style="width: 100%" pt:type="reset"/>
                <br/><br/>
                <h:commandButton id="submit" type="submit" value="create customer" action="#{customerForm.submitForm()}"
                                 style="width: 100%"
                />
                <br/><br/>

            </h:form>

        </ui:define>
    </ui:composition>
</html>
