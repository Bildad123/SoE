<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <h:outputStylesheet library="css" name="template.css"></h:outputStylesheet>
    <h:outputStylesheet library="css" name="header.css"></h:outputStylesheet>
    <h:outputStylesheet library="css" name="table.css"></h:outputStylesheet>
    <h:outputStylesheet library="css" name="form.css"></h:outputStylesheet>

</h:head>

<h:body>
        <div class="header" style="margin-bottom: 15px; height: 30px">
            <ui:insert name="header">
                <ui:include src="header.xhtml"></ui:include>
            </ui:insert>
        </div>

        <div class="container">
            <div class="content">
                <div style="width: fit-content;min-width: 100%;overflow-x: hidden;background-color: #ffffff;height: 50%;margin: 5px auto 10px auto;">
                    <span>&#128100; #{request.userPrincipal.name.toUpperCase()}</span>
                </div>
                <ui:insert name="content">
                    <ui:include src="content.xhtml"></ui:include>
                </ui:insert>
            </div>
        </div>


        <div class="footer">
            <ui:insert name="footer">
                <ui:include src="footer.xhtml"></ui:include>
            </ui:insert>
        </div>

</h:body>


</html>
