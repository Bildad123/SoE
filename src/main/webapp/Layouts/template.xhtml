<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	 xmlns="http://www.w3.org/1999/xhtml"
          xmlns:f="jakarta.faces.core"
          xmlns:h="jakarta.faces.html"
          xmlns:ui="jakarta.faces.facelets"
          xmlns:faces="jakarta.faces"
          xmlns:pt="jakarta.faces.passthrough">

<h:head>


    <h:outputStylesheet library="css" name="template.css"></h:outputStylesheet>
    <h:outputStylesheet library="css" name="header.css"></h:outputStylesheet>
    <h:outputStylesheet library="css" name="table.css"></h:outputStylesheet>
    <h:outputStylesheet library="css" name="form.css"></h:outputStylesheet>

</h:head>

<h:body>
        <div class="header" style="margin-bottom: 15px; height: 30px">
            <ui:insert name="header">
                <ui:include src="header.xhtml"></ui:include>
            </ui:insert>
        </div>

        <div class="container">
            <div class="content">
                <div style="width: fit-content;min-width: 100%;overflow-x: hidden;background-color: #ffffff;height: 50%;margin: 5px auto 10px auto; display: flex; flex-direction: row; justify-content:space-between;">
                    <span>&#128100; #{request.userPrincipal.name}</span>

                    <h:commandLink
                            rendered="#{request.userPrincipal.name != null}"
                            value="Logout &#9660;" action="#{logout.submit()}" styleClass="data-table-create-h-link">
                        <f:ajax listener="#{logout.submit()}" render="container"/>
                    </h:commandLink>
                </div>
                <ui:insert name="content">
                    <ui:include src="content.xhtml"></ui:include>
                </ui:insert>
            </div>
        </div>


        <div class="footer">
            <ui:insert name="footer">
                <ui:include src="footer.xhtml"></ui:include>
            </ui:insert>
        </div>

</h:body>


</html>
