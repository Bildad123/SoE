<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	xmlns="http://www.w3.org/1999/xhtml"
         xmlns:f="http://xmlns.jcp.org/jsf/core"
         xmlns:h="http://xmlns.jcp.org/jsf/html"
         xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:composition template="Layouts/template.xhtml">

        <ui:define name="header">
            <ui:insert name="header">
                <ui:include src="header.xhtml"></ui:include>
            </ui:insert>
            <f:metadata>
                <f:viewAction action="#{allCustomers.doRefresh}" />
            </f:metadata>

        </ui:define>


        <ui:define name="content">
            <span style="font-size: small">Showing #{allCustomers.customers.size()} customer(s) in the database</span><br></br>



            <input type="text" placeholder="Search for Customer" style="width: 60%; height: 30px; margin-bottom: 20px; margin-top: 20px " ></input>

            <h:form>
                <h:dataTable value="#{allCustomers.customers}" var="c"
                             first="#{allCustomers.currentRows}"
                             rows="#{allCustomers.maxTableRows}"
                             styleClass="customers-table"
                             headerClass="customers-table-header"
                             rowClasses="customers-table-odd-row,customers-table-even-row"
                             cellspacing="15px"
                             cellpadding="15px"
                             style="text-align: left"
                             rendered="#{allCustomers.customers.size() > 0}">

                    <h:column>
                        <f:facet name="header">Fullname</f:facet>
                        #{c.firstname} #{c.lastname}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Email</f:facet>
                        #{c.email}

                    </h:column>

                    <h:column>
                        <f:facet name="header">Address</f:facet>
                        #{c.zip}, #{c.street}

                    </h:column>

                    <f:facet name="footer">
                        <h:panelGroup rendered="#{allCustomers.showPageList}">
                            <h:commandButton value="Back" action="#{allCustomers.back}" rendered="#{allCustomers.displayBackButton}" styleClass="form-paginating-button-back" />
                            <h:selectOneMenu value="#{allCustomers.selectedPage}">
                                <f:selectItems value="#{allCustomers.pages}" var="page" itemLabel="Seite #{page}" itemValue="#{page}" />
                                <f:ajax listener="#{allCustomers.pageChange}" render="@form"/>
                            </h:selectOneMenu>
                            <h:commandButton value="Next" action="#{allCustomers.next}" rendered="#{allCustomers.displayNextButton}" styleClass="form-paginating-button-next" />


                            <h:commandButton value="Create Customer" action="#{customerForm.createCustomer}"  styleClass="form-paginating-button-next" />


                        </h:panelGroup>
                    </f:facet>
                </h:dataTable>
            </h:form>

        </ui:define>
    </ui:composition>

</html>
