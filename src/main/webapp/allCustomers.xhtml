<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	xmlns="http://www.w3.org/1999/xhtml"
         xmlns:f="http://xmlns.jcp.org/jsf/core"
         xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
         xmlns:h = "http://xmlns.jcp.org/jsf/html"
         xmlns:jsf = "http://xmlns.jcp.org/jsf"
         xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
>

    <ui:composition template="Layouts/template.xhtml">
        <ui:define name="content">
            <h:outputLabel style="font-size: small" id="qty">
                Matched #{allCustomers.filteredCustomers.size()} customer(s) from the database
            </h:outputLabel><br></br>

            <h:form autocomplete="off">
                <div style="display: flex; flex-direction: row; justify-content:space-between; align-items: center;" >
                    <h:inputText pt:type="text" pt:placeholder="Search for Customer by Customer Name" id="serch_text" value="#{allCustomers.searchText}"  styleClass="form-search-text-input" >
                        <f:ajax event="keyup" listener="#{allCustomers.keypress()}" render="data-table-customers qty" execute="@this"/>
                    </h:inputText>
                </div>

                <h:panelGroup id="data-table-customers">
                <h:dataTable value="#{allCustomers.filteredCustomers}" var="c"
                             id="customers-data-table"
                             first="#{allCustomers.pagination.currentRows}"
                             rows="#{allCustomers.pagination.maxTableRows}"
                             styleClass="customers-table"
                             headerClass="customers-table-header"
                             rowClasses="customers-table-odd-row,customers-table-even-row"
                             cellspacing="15px"
                             cellpadding="15px"
                             style="text-align: left"
                             rendered="#{allCustomers.filteredCustomers.size() > 0}">

                    <h:column>
                        <f:facet name="header">Firstname</f:facet>
                        <h:link value="#{c.firstname}" outcome="customerForm.xhtml">
                            <f:param name="id" value="#{c.id}" />
                            <f:param name="operation" value="Read"/>
                        </h:link>
                    </h:column>


                    <h:column>
                        <f:facet name="header">Lastname</f:facet>
                        <h:link value="#{c.lastname}" outcome="customerForm.xhtml">
                            <f:param name="id" value="#{c.id}" />
                            <f:param name="operation" value="Read"/>
                        </h:link>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Email</f:facet>
                        <h:link value="#{c.email}" outcome="customerForm.xhtml">
                            <f:param name="id" value="#{c.id}" />
                            <f:param name="operation" value="Read"/>
                        </h:link>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Phone</f:facet>
                        <h:link value="#{c.phone}" outcome="customerForm.xhtml">
                            <f:param name="id" value="#{c.id}" />
                            <f:param name="operation" value="Read"/>
                        </h:link>

                    </h:column>

                    <h:column>
                        <f:facet name="header">State</f:facet>
                        <h:link value="#{c.state}" outcome="customerForm.xhtml">
                            <f:param name="id" value="#{c.id}" />
                            <f:param name="operation" value="Read"/>
                        </h:link>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Street</f:facet>
                        <h:link value="#{c.street}" outcome="customerForm.xhtml">
                            <f:param name="id" value="#{c.id}" />
                            <f:param name="operation" value="Read"/>
                        </h:link>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Zip</f:facet>
                        <h:link value="#{c.zip}" outcome="customerForm.xhtml">
                            <f:param name="id" value="#{c.id}" />
                            <f:param name="operation" value="Read"/>
                        </h:link>
                    </h:column>


                    <f:facet name="footer">
                        <h:panelGroup rendered="#{allCustomers.pagination.showPageList}">
                            <h:commandButton value="Back" disabled="#{!allCustomers.pagination.displayBackButton}" styleClass="form-paginating-button-back" >
                                <f:ajax listener="#{allCustomers.pagination.back()}" render="@form"/>
                            </h:commandButton>
                            <h:selectOneMenu value="#{allCustomers.pagination.selectedPage}">
                                <f:selectItems value="#{allCustomers.pagination.pages}" var="page" itemLabel="Page #{page}" itemValue="#{page}" />
                                <f:ajax listener="#{allCustomers.pagination.pageChange}" render="@form"/>
                            </h:selectOneMenu>
                            <h:commandButton value="Next"  disabled="#{!allCustomers.pagination.displayNextButton}" styleClass="form-paginating-button-next" >
                                <f:ajax listener="#{allCustomers.pagination.next()}" render="@form"/>
                            </h:commandButton>
                        </h:panelGroup>
                    </f:facet>

                </h:dataTable>
                </h:panelGroup>
            </h:form>

        </ui:define>
    </ui:composition>

</html>
