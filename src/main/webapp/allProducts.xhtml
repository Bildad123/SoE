<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	xmlns="http://www.w3.org/1999/xhtml"
         xmlns:f="http://xmlns.jcp.org/jsf/core"
         xmlns:h="http://xmlns.jcp.org/jsf/html"
         xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="Layouts/template.xhtml">
    <ui:define name="header">
        <h:outputStylesheet library="css" name="table.css"></h:outputStylesheet>
        <ui:insert name="header"></ui:insert>
    </ui:define>
    <ui:define name="content">
        <span style="font-size: small">Showing #{allProducts.products.size()} products(s) in the database</span><br></br>
        <h:form>
            <h:dataTable value="#{allProducts.products}" var="p"
                         styleClass="customers-table"
                         headerClass="customers-table-header"
                         rowClasses="customers-table-odd-row,customers-table-even-row"
                         cellspacing="15px"
                         cellpadding="15px"
                         style="text-align: left"
                         rendered="#{allProducts.products.size() > 0}">

                <h:column>
                    <f:facet name="header">Name</f:facet>
                    #{p.name}
                </h:column>

                <h:column>
                    <f:facet name="header">Price</f:facet>
                    #{p.price}
                    <span style="margin-left: 10px">&#8364;</span>

                </h:column>
            </h:dataTable>
        </h:form>

    </ui:define>
</ui:composition>

</html>
