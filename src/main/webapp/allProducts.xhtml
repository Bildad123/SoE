<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	xmlns="http://www.w3.org/1999/xhtml"
         xmlns:f="http://xmlns.jcp.org/jsf/core"
         xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
         xmlns:h = "http://xmlns.jcp.org/jsf/html"
         xmlns:jsf = "http://xmlns.jcp.org/jsf"
         xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">


<ui:composition template="Layouts/template.xhtml">
    <ui:define name="content">
        <h:outputLabel style="font-size: small" id="matched-product">Matched #{allProducts.filteredProducts.size()} products(s) in the database</h:outputLabel><br></br>
        <h:form autocomplete="off">
            <div style="display: flex; flex-direction: row; justify-content:space-between; align-items: center;" >
                <h:inputText pt:type="text" pt:placeholder="Search for Product by Product Name"  id="search-text" value="#{allProducts.searchText}" styleClass="form-search-text-input" >
                    <f:ajax event="keyup" listener="#{allProducts.keypress()}" render="data-table-product matched-product" execute="@this"/>
                </h:inputText>

                <h:link value="&#10133;  Create Product" styleClass="data-table-create-h-link" outcome="productForm.xhtml"></h:link>
            </div>

            <h:panelGroup id="data-table-product">
                <h:dataTable value="#{allProducts.filteredProducts}" var="p"
                         id="product-data-table"
                         first="#{allProducts.pagination.currentRows}"
                         rows="#{allProducts.pagination.maxTableRows}"
                         styleClass="customers-table"
                         headerClass="customers-table-header"
                         rowClasses="customers-table-odd-row,customers-table-even-row"
                         cellspacing="15px"
                         cellpadding="15px"
                         style="text-align: left"
                         rendered="#{allProducts.filteredProducts.size() > 0}">

                <h:column>
                    <f:facet name="header">Name</f:facet>
                    <h:link value="#{p.name}" outcome="productForm.xhtml">
                        <f:param name="id" value="#{p.id}" />
                        <f:param name="operation" value="Read"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Price</f:facet>
                    <h:link value="#{p.listPrice}" outcome="productForm.xhtml">
                        <f:param name="id" value="#{p.id}" />
                        <f:param name="operation" value="Read"/>
                    </h:link>
                    <span style="margin-left: 10px">&#8364;</span>
                </h:column>


                <h:column>
                    <f:facet name="header">Band Name</f:facet>
                    <h:link value="#{p.brand.brandName}" outcome="productForm.xhtml">
                        <f:param name="id" value="#{p.id}" />
                        <f:param name="operation" value="Read"/>
                    </h:link>
                </h:column>

                    <h:column>
                        <f:facet name="header">Model Year</f:facet>
                        <h:link value="#{p.modelYear}" outcome="productForm.xhtml">
                            <f:param name="id" value="#{p.id}" />
                            <f:param name="operation" value="Read"/>
                        </h:link>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Category Name</f:facet>
                        <h:link value="#{p.category.categoryName}" outcome="productForm.xhtml">
                            <f:param name="id" value="#{p.id}" />
                            <f:param name="operation" value="Read"/>
                        </h:link>
                    </h:column>

                    <h:column>
                        <f:facet name="header"><h:outputText value="Action"></h:outputText></f:facet>

                        <h:link value="&#128221;" outcome="productForm.xhtml" styleClass="data-table-edit-h-link">
                            <f:param name="id" value="#{p.id}" />
                            <f:param name="operation" value="Edit"/>
                        </h:link>

                        <h:link value="&#x274C;" outcome="productForm.xhtml" styleClass="data-table-edit-h-link">
                            <f:param name="id" value="#{p.id}" />
                            <f:param name="operation" value="Delete"/>
                        </h:link>
                    </h:column>


                    <f:facet name="footer">
                    <h:panelGroup rendered="#{allProducts.pagination.showPageList}">
                        <h:commandButton value="Back" disabled="#{!allProducts.pagination.displayBackButton}" styleClass="form-paginating-button-back" >
                            <f:ajax listener="#{allProducts.pagination.back()}" render="@form"/>
                        </h:commandButton>
                        <h:selectOneMenu value="#{allProducts.pagination.selectedPage}">
                            <f:selectItems value="#{allProducts.pagination.pages}" var="page" itemLabel="Page #{page}" itemValue="#{page}" />
                            <f:ajax listener="#{allProducts.pagination.pageChange}" render="@form"/>
                        </h:selectOneMenu>
                        <h:commandButton value="Next" disabled="#{!allProducts.pagination.displayNextButton}" styleClass="form-paginating-button-next" >
                            <f:ajax listener="#{allProducts.pagination.next()}" render="@form"/>
                        </h:commandButton>
                    </h:panelGroup>
                </f:facet>
                </h:dataTable>
            </h:panelGroup>
        </h:form>

    </ui:define>
</ui:composition>

</html>
