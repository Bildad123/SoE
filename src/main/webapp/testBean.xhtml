<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:jsf="http://xmlns.jcp.org/jsf"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
      xmlns:c="http://java.sun.com/jsp/jstl/core"
>


<ui:composition template="Layouts/template.xhtml">

   <ui:define name="content">

      <h:form>
         <div class="searchable-select">
            <input type="text" placeholder="Select an option" />
            <select>
               <f:selectItems value="#{bean.options}" var="option" />
            </select>
         </div>

         <div class="searchable-select">
            <h:inputText id="input" value="#{bean.selectedOption}">
               <f:ajax event="keyup" execute="@this" render="select each" />
            </h:inputText>
         </div>

      </h:form>
      <div id="each">
         <c:forEach items="#{bean.options}" var="option">
            <h:outputLabel value="option : #{option.option}"></h:outputLabel>
            <h:outputLabel value="selected : #{bean.selectedOption}"></h:outputLabel><br></br>

            <h:outputText value="#{option.option}" rendered="#{option.option.toLowerCase().contains(bean.selectedOption.toLowerCase())}" />
         </c:forEach>
      </div>




   </ui:define>
</ui:composition>

</html>
