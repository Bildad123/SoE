<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:jsf="http://xmlns.jcp.org/jsf"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

<ui:composition template="Layouts/template.xhtml">
   <ui:define name="header">
      <h:outputStylesheet library="css" name="table.css"></h:outputStylesheet>
      <ui:insert name="header"></ui:insert>
   </ui:define>
   <ui:define name="content">

      <h:form autocomplete="off" id="create-order-form">

         <div style="display: flex; flex-direction: column;">
            <fieldset >
               <legend>CREATE ORDER</legend>

               <h:outputLabel value="Customer"></h:outputLabel>
               <h:inputText pt:type="text" pt:placeholder="Search for Customer" id="search_text" value="#{orderForm.searchTextCustomers}" styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0" >
                  <f:ajax event="keyup" listener="#{orderForm.keypressCustomer()}" render="data-table-customer matched-customers" execute="@this"/>
               </h:inputText>

               <h:panelGroup id="data-table-customer">
                  <h:dataTable value="#{orderForm.filteredCustomers}" var="c"
                               id="customer-data-table"
                               first="#{orderForm.paginationCustomer.currentRows}"
                               rows="#{orderForm.paginationCustomer.maxTableRows}"
                               styleClass="customers-table"
                               headerClass="customers-table-header"
                               rowClasses="customers-table-odd-row,customers-table-even-row"
                               cellspacing="15px"
                               cellpadding="15px"
                               style="text-align: left"
                               rendered="#{orderForm.showCustomerTable and orderForm.filteredCustomers.size()>0}">

                     <h:column>
                        <h:commandLink value="#{c.firstname.concat('  ').concat(c.lastname).concat('      ').concat(c.zip).concat(', ').concat(c.street)}" style="white-space: pre-wrap" >
                           <f:ajax listener="#{orderForm.updateCustomerSearchText(c.firstname.concat(' ').concat(c.lastname).concat('        ').concat(c.city).concat('        ').concat(c.zip).concat(',  ').concat(c.street))}" render="@form"></f:ajax>
                        </h:commandLink>
                     </h:column>

                     <f:facet name="footer">
                        <h:panelGroup rendered="#{orderForm.paginationCustomer.showPageList}">
                           <h:commandButton value="Back" disabled="#{!orderForm.paginationCustomer.displayBackButton}" styleClass="form-paginating-button-back" >
                              <f:ajax listener="#{orderForm.paginationCustomer.back()}" render="@form"/>
                           </h:commandButton>
                           <h:selectOneMenu value="#{orderForm.paginationCustomer.selectedPage}">
                              <f:selectItems value="#{orderForm.paginationCustomer.pages}" var="page" itemLabel="Page #{page}" itemValue="#{page}" />
                              <f:ajax listener="#{orderForm.paginationCustomer.pageChange}" render="@form"/>
                           </h:selectOneMenu>
                           <h:commandButton value="Next" disabled="#{!orderForm.paginationCustomer.displayNextButton}" styleClass="form-paginating-button-next" >
                              <f:ajax listener="#{orderForm.paginationCustomer.next()}" render="@form"/>
                           </h:commandButton>
                        </h:panelGroup>
                     </f:facet>
                  </h:dataTable>
               </h:panelGroup>

               <br/><br/><hr style="width: 100%; border: 1px solid #dddddd"></hr><br></br>

               <h:outputLabel value="Order date"></h:outputLabel>
               <h:inputText
                       value="#{orderForm.orderDate}"
                       converter="localDateConverter"
                       type="date"
                       styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0" >
                  <f:ajax listener="#{orderForm.updateOrderedDate}"></f:ajax>
               </h:inputText>

               <br/><br/><hr style="width: 100%; border: 1px solid #dddddd"></hr><br></br>

               <h:outputLabel value="Order status"></h:outputLabel>
               <h:selectOneMenu value="#{orderForm.selectedOrderStatus}" styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0; font: inherit; font-size: small">
                  <f:selectItems value="#{orderForm.orderStatuses}"  var="status" itemLabel="#{status}" itemValue="#{status}"  />
               </h:selectOneMenu>

               <br/><br/><hr style="width: 100%; border: 1px solid #dddddd"></hr><br></br>

               <h:outputLabel value="Required date"></h:outputLabel>
               <h:inputText
                       value="#{orderForm.requiredDate}"
                       converter="localDateConverter"
                       type="date"
                       styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0" >
                  <f:ajax listener="#{orderForm.updateRequiredDate}"></f:ajax>
               </h:inputText>

               <br/><br/><hr style="width: 100%; border: 1px solid #dddddd"></hr><br></br>


               <h:outputLabel value="Shipped date"></h:outputLabel>
               <h:inputText
                       value="#{orderForm.shippedDate}"
                       converter="localDateConverter"
                       type="date"
                       styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0" >
                  <f:ajax listener="#{orderForm.updateShippedDate}"></f:ajax>
               </h:inputText>

               <br/><br/><hr style="width: 100%; border: 1px solid #dddddd"></hr><br></br>

               <h:outputLabel value="Stores" id="store"></h:outputLabel>
               <h:selectOneMenu value="#{orderForm.selectedStoreId}" styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0; font: inherit; font-size: small">
                  <f:selectItems value="#{orderForm.stores}"  var="store" itemLabel="#{store.storeName}" itemValue="#{store.id}"  />
               </h:selectOneMenu>

               <br/><br/><hr style="width: 100%; border: 1px solid #dddddd"></hr><br></br>

               <h:outputLabel value="Staffs" id="staff"></h:outputLabel>
               <h:selectOneMenu
                       converter="staffConverter"
                       value="#{orderForm.selectedStaff}" styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0; font: inherit; font-size: small">
                  <f:selectItems value="#{orderForm.staffs}" var="staff" itemLabel="#{staff.firstName.concat(',  ').concat(staff.lastName)}" itemValue="#{staff}" />
               </h:selectOneMenu>

               <br/><br/><hr style="width: 100%; border: 1px solid #dddddd"></hr><br></br><br></br>



               <h:outputLabel value="Product"></h:outputLabel>
               <h:inputText pt:type="text" pt:placeholder="Search for Product" id="search_text1" value="#{orderForm.searchTextProducts}" styleClass="form-input-text" style="width: 100%;  box-sizing: border-box; margin: 0" >
                  <f:ajax event="keyup" listener="#{orderForm.keypressProduct()}" render="data-table-product matched-products" execute="@this"/>
               </h:inputText>
               <h:panelGroup id="data-table-product">
                  <h:dataTable value="#{orderForm.filteredProducts}" var="p"
                               id="product-data-table"
                               first="#{orderForm.paginationProducts.currentRows}"
                               rows="#{orderForm.paginationProducts.maxTableRows}"
                               styleClass="customers-table"
                               headerClass="customers-table-header"
                               rowClasses="customers-table-odd-row,customers-table-even-row"
                               cellspacing="15px"
                               cellpadding="15px"
                               style="text-align: left"
                               rendered="#{orderForm.showProductTable and orderForm.filteredProducts.size()>0}">

                     <h:column>
                     <h:commandLink value="#{p.name.concat('        ').concat(p.listPrice).concat( '&#8364;').concat('        ').concat(p.brand.brandName)} " style="white-space: pre-wrap">
                           <f:ajax listener="#{orderForm.updateProductSearchText(p.name.concat('        ').concat(p.listPrice).concat( '&#8364;').concat('        ').concat(p.brand.brandName))}"  render="@form"></f:ajax>
                           <f:ajax listener="#{orderForm.addOrderItems(p)}"/>
                        </h:commandLink>
                     </h:column>


                  <f:facet name="footer">
                     <h:panelGroup rendered="#{orderForm.paginationProducts.showPageList}">
                        <h:commandButton value="Back"  disabled="#{!orderForm.paginationProducts.displayBackButton}" styleClass="form-paginating-button-back" >
                           <f:ajax listener="#{orderForm.paginationProducts.back()}" render="@form"/>
                        </h:commandButton>
                        <h:selectOneMenu value="#{orderForm.paginationProducts.selectedPage}">
                           <f:selectItems value="#{orderForm.paginationProducts.pages}" var="page" itemLabel="Page #{page}" itemValue="#{page}" />
                           <f:ajax listener="#{orderForm.paginationProducts.pageChange}" render="@form"/>
                        </h:selectOneMenu>
                        <h:commandButton value="Next" disabled="#{!orderForm.paginationProducts.displayNextButton}" styleClass="form-paginating-button-next" >
                           <f:ajax listener="#{orderForm.paginationProducts.next()}" render="@form"/>
                        </h:commandButton>
                     </h:panelGroup>
                  </f:facet>
               </h:dataTable>
               </h:panelGroup>
            </fieldset>
         </div>

         <br/><br/><hr style="width: 100%; border: 1px solid #dddddd"></hr><br></br><br></br>

         <h:panelGroup id="data-table-order-items">
         <h:dataTable value="#{orderForm.orderItems}" var="oi"
                      id="data-table-3"
                      styleClass="customers-table"
                      headerClass="customers-table-header"
                      rowClasses="customers-table-odd-row,customers-table-even-row"
                      cellspacing="15px"
                      cellpadding="15px"
                      style="text-align: left"
                      rendered="#{orderForm.orderItems.size() > 0}">

            <h:column>
               <f:facet name="header">Product</f:facet>
               #{oi.product.name}
            </h:column>

            <h:column>
               <f:facet name="header">Quantity</f:facet>
               #{oi.quantity}

            </h:column>

            <h:column>
               <f:facet name="header">Action</f:facet>
               <h:commandButton  style="padding: 0 3px 0 3px; margin-right: 10px" value="&#10133;">
                  <f:ajax  listener="#{orderForm.changeQuantity(true, oi.product)}" render="@form"></f:ajax>
               </h:commandButton>
               <h:commandButton  style="padding: 0 3px 0 3px; margin-right: 10px" value="&#10134;">
                  <f:ajax listener="#{orderForm.changeQuantity(false, oi.product)}" render="@form"></f:ajax>
               </h:commandButton>
               <h:commandButton  style="padding: 0 3px 0 3px; margin-right: 10px" value="&#x274C;">
                  <f:ajax event="click" listener="#{orderForm.deleteItem(oi)}" render="@form"></f:ajax>
               </h:commandButton>
            </h:column>

         </h:dataTable><br></br>
         </h:panelGroup>


         <h:commandButton id="submit" type="submit" value="Make order" action="#{orderForm.submitForm()}"
                          style="width: 100%"
         />
         <br/><br/>

      </h:form>

   </ui:define>
</ui:composition>




</html>
