<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:jsf="http://xmlns.jcp.org/jsf"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

    <ui:composition template="Layouts/template.xhtml">
        <ui:define name="header">
            <h:outputStylesheet library="css" name="table.css"></h:outputStylesheet>
            <ui:insert name="header"></ui:insert>
        </ui:define>
        <ui:define name="content">

            <h:form id="create-order-form">
                <fieldset>
                    <legend>Create Order</legend>
                    <br/>

                    <h:outputLabel  value="Customer" styleClass="form-label"/>
                    <h:selectOneMenu value="#{orderForm.selectedCustomer}" styleClass="form-input-text">
                        <f:selectItems value="#{orderForm.customers}"  />
                    </h:selectOneMenu>
                    <br/><br/>
                    <hr style="width: 100%; color: #EEEEEE"></hr><br/>
                    <h:outputLabel value="Product" styleClass="form-label"/>
                    <h:selectOneMenu value="#{orderForm.selectedProduct}" style="width: 58%; margin-right: 15px">
                        <f:selectItems value="#{orderForm.products}"  />
                    </h:selectOneMenu>
                    <h:commandButton  style="padding: 0 1% 0 1%; margin-right: 15px" value="&#10133;" action="#{orderForm.updateOrderItems(true)}"></h:commandButton>
                    <h:commandButton  style="padding: 0 1% 0 1%" value="&#10134;" action="#{orderForm.updateOrderItems(false)}"></h:commandButton>

                    <br/><br/>
                </fieldset>
                <br/><br/>

                <h:dataTable value="#{orderForm.orderItems}" var="oi"
                             styleClass="customers-table"
                             headerClass="customers-table-header"
                             rowClasses="customers-table-odd-row,customers-table-even-row"
                             cellspacing="15px"
                             cellpadding="15px"
                             style="text-align: left"
                             rendered="#{orderForm.orderItems.size() > 0}">

                    <h:column>
                        <f:facet name="header">Product</f:facet>

                        #{oi.product}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Quantity</f:facet>
                        #{oi.quantity}

                    </h:column>

                    <h:column>
                        <f:facet name="header">Delete</f:facet>
                        <h:commandButton  style="padding: 0 3px 0 3px" value="&#x274C;" action="#{orderForm.deleteItem(oi)}"></h:commandButton>
                    </h:column>

                </h:dataTable><br></br>


                <h:commandButton id="submit" type="submit" value="make order" action="#{orderForm.submitForm()}"
                                 style="width: 100%"
                />
                <br/><br/>

            </h:form>

        </ui:define>
    </ui:composition>

</html>
