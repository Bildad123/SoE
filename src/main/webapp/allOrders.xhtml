<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	 xmlns="http://www.w3.org/1999/xhtml"
         xmlns:f="http://xmlns.jcp.org/jsf/core"
         xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
         xmlns:h = "http://xmlns.jcp.org/jsf/html"
         xmlns:jsf = "http://xmlns.jcp.org/jsf"
          xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
>


<ui:composition template="Layouts/template.xhtml">

    <ui:define name="content">
        <h:outputLabel style="font-size: small" id="qty">Matched #{allOrders.filteredOrders.size()} orders(s) in the database</h:outputLabel><br></br>
        <h:form autocomplete="off">
            <div style="display: flex; flex-direction: row; justify-content:space-between; align-items: center;" >
                <h:inputText pt:type="text" pt:placeholder="Search for Order by Customer Name" id="serch_text" value="#{allOrders.searchText}"  class="form-search-text-input" >
                    <f:ajax event="keyup" listener="#{allOrders.keypress()}" render="data-table-orders qty" execute="@this"/>
                </h:inputText>
                <h:link value="&#10133;  Create Order" styleClass="data-table-create-h-link" outcome="orderForm.xhtml"></h:link>
        </div>
            <h:panelGroup id="data-table-orders">
                <h:dataTable value="#{allOrders.filteredOrders}" var="o"
                         id="orders-data-table"
                         first="#{allOrders.pagination.currentRows}"
                         rows="#{allOrders.pagination.maxTableRows}"
                         styleClass="customers-table"
                         headerClass="customers-table-header"
                         rowClasses="customers-table-odd-row,customers-table-even-row"
                         cellspacing="15px"
                         cellpadding="15px"
                         style="text-align: left"
                         rendered="#{allOrders.filteredOrders.size() > 0}">

                <h:column >
                    <f:facet name="header">Fullname</f:facet>
                    <h:link value="#{o.customer.firstname} #{o.customer.lastname}" outcome="customerForm.xhtml">
                        <f:param name="id" value="#{o.customer.id}" />
                        <f:param name="operation" value="Read"/>
                    </h:link>
                </h:column>


                    <h:column>
                        <f:facet name="header">Order Date</f:facet>
                        #{o.orderDate}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Order Status</f:facet>
                        #{o.orderStatus}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Required Date</f:facet>
                        #{o.requiredDate}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Shipped Date</f:facet>
                        #{o.shippedDate}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Staff Fullname</f:facet>
                        #{o.staff.firstName} #{o.staff.lastName}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Store Name</f:facet>
                        #{o.store.storeName}
                    </h:column>

                    <h:column>
                        <f:facet name="header"><h:outputText value="Action"></h:outputText></f:facet>

                        <h:link value="&#128209;" outcome="orderForm.xhtml" styleClass="data-table-edit-h-link">
                            <f:param name="id" value="#{o.id}" />
                            <f:param name="operation" value="Read"/>
                        </h:link>

                        <h:link value="&#128221;" outcome="orderForm.xhtml" styleClass="data-table-edit-h-link">
                            <f:param name="id" value="#{o.id}" />
                            <f:param name="operation" value="Edit"/>
                        </h:link>

                        <h:link value="&#x274C;" outcome="orderForm.xhtml" styleClass="data-table-edit-h-link">
                            <f:param name="id" value="#{o.id}" />
                            <f:param name="operation" value="Delete"/>
                        </h:link>
                    </h:column>



                    <f:facet name="footer">
                    <h:panelGroup rendered="#{allOrders.pagination.showPageList}">
                        <h:commandButton value="Back"  disabled="#{!allOrders.pagination.displayBackButton}" styleClass="form-paginating-button-back" >
                            <f:ajax listener="#{allOrders.pagination.back()}" render="@form"/>
                        </h:commandButton>
                        <h:selectOneMenu value="#{allOrders.pagination.selectedPage}">
                            <f:selectItems value="#{allOrders.pagination.pages}" var="page" itemLabel="Page #{page}" itemValue="#{page}" />
                            <f:ajax listener="#{allOrders.pagination.pageChange}" render="@form"/>
                        </h:selectOneMenu>
                        <h:commandButton value="Next"  disabled="#{!allOrders.pagination.displayNextButton}" styleClass="form-paginating-button-next" >
                            <f:ajax listener="#{allOrders.pagination.next}" render="@form"/>
                        </h:commandButton>
                    </h:panelGroup>
                </f:facet>


            </h:dataTable>
            </h:panelGroup>
        </h:form>

    </ui:define>
</ui:composition>

</html>
