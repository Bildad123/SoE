<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	xmlns="http://www.w3.org/1999/xhtml"
         xmlns:f="http://xmlns.jcp.org/jsf/core"
         xmlns:h="http://xmlns.jcp.org/jsf/html"
         xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="Layouts/template.xhtml">
    <ui:define name="header">
        <h:outputStylesheet library="css" name="table.css"></h:outputStylesheet>
        <ui:insert name="header"></ui:insert>
    </ui:define>
    <ui:define name="content">
        <span style="font-size: small">Showing #{allOrders.orders.size()} orders(s) in the database</span><br></br>
        <h:form>
            <h:dataTable value="#{allOrders.customersWithOrders}" var="c"
                         styleClass="customers-table"
                         headerClass="customers-table-header"
                         rowClasses="customers-table-odd-row,customers-table-even-row"
                         cellspacing="15px"
                         cellpadding="15px"
                         style="text-align: left"
                         rendered="#{allOrders.orders.size() > 0}">

                <h:column>
                    <f:facet name="header">Fullname</f:facet>
                    #{c}
                </h:column>

                <h:column>
                    <f:facet name="header" >Orders</f:facet>

                        <ui:repeat value="#{allOrders.ooii}" var="ooii" >
                            <ol style="font-size: small">
                                <ui:repeat value="#{ooii}" var="oi" >
                                    <ui:fragment rendered="#{oi.order.customer.id == c.id}">
                                        <li>#{oi.product} ( #{oi.quantity} X )</li>
                                    </ui:fragment>
                                </ui:repeat>
                            </ol>
                            Total Price : #{0} &#8364;
                            <p></p>
                            <br/>
                            <br/>
                        </ui:repeat>
                </h:column>

            </h:dataTable>
        </h:form>

    </ui:define>
</ui:composition>

</html>
