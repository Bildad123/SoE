<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	xmlns="http://www.w3.org/1999/xhtml"
         xmlns:f="http://xmlns.jcp.org/jsf/core"
         xmlns:h="http://xmlns.jcp.org/jsf/html"
         xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="Layouts/template.xhtml">

    <ui:define name="header">
        <ui:insert name="header">
            <ui:include src="header.xhtml"></ui:include>
        </ui:insert>
        <f:metadata>
            <f:viewAction action="#{allOrders.doRefresh}" />
        </f:metadata>

    </ui:define>

    <ui:define name="content">
        <span style="font-size: small">Showing #{allOrders.orders.size()} orders(s) in the database</span><br></br>
        <h:form>
            <h:dataTable value="#{allOrders.map}" var="entry"
                         first="#{allOrders.currentRows}"
                         rows="#{allOrders.maxTableRows}"
                         styleClass="customers-table"
                         headerClass="customers-table-header"
                         rowClasses="customers-table-odd-row,customers-table-even-row"
                         cellspacing="15px"
                         cellpadding="15px"
                         style="text-align: left"
                         rendered="#{allOrders.orders.size() > 0}">

                <h:column>
                    <f:facet name="header">Fullname</f:facet>
                    <h:link style="text-decoration:none; color: inherit" outcome="allCustomers.xhtml">#{entry.key.customer}</h:link>


                </h:column>

                <h:column>
                    <f:facet name="header" >Orders</f:facet>
                    <ol style="font-size: small">
                        <ui:repeat value="#{entry.value}" var="v">
                            <li>#{v.product} ( #{v.quantity}X )</li>
                        </ui:repeat>
                    </ol>
                </h:column>

                <f:facet name="footer">
                    <h:panelGroup rendered="#{allOrders.showPageList}">
                        <h:commandButton value="Back" action="#{allOrders.back}" rendered="#{allOrders.displayBackButton}" styleClass="form-paginating-button-back" />
                        <h:selectOneMenu value="#{allOrders.selectedPage}">
                            <f:selectItems value="#{allOrders.pages}" var="page" itemLabel="Seite #{page}" itemValue="#{page}" />
                            <f:ajax listener="#{allOrders.pageChange}" render="@form"/>
                        </h:selectOneMenu>
                        <h:commandButton value="Next" action="#{allOrders.next}" rendered="#{allOrders.displayNextButton}" styleClass="form-paginating-button-next" />
                    </h:panelGroup>
                </f:facet>


            </h:dataTable>
        </h:form>

    </ui:define>
</ui:composition>

</html>
