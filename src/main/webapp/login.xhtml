<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:jsf="http://xmlns.jcp.org/jsf"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

<ui:composition template="Layouts/template.xhtml">
   <ui:define name="content">

      <h:form>

         <fieldset>
            <legend>#{'Login'}</legend>


            <h:outputLabel for="username" value="Username:"  styleClass="form-label"/>
            <h:inputText id="username" value="#{login.email}" required="true"
                         styleClass="form-input-text"
            />
            <br/><br/>

            <h:outputLabel for="password" value="Password:"  styleClass="form-label"/>
            <h:inputSecret id="password" value="#{login.password}" required="true"
                           styleClass="form-input-text"
            />
            <br/><br/>

         </fieldset>
         <br/><br/>

         <h:commandButton id="submit" update="@form" value="Login" action="#{login.submit()}" style="width: 100%"/>
         <br/><br/>
      </h:form>
   </ui:define>
</ui:composition>
</html>
