<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:jsf="http://xmlns.jcp.org/jsf"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

<ui:composition template="Layouts/template.xhtml">

   <ui:define name="content">

      <h:form id="create-customer-form">
         <h:dataTable value="#{allCustomers.tblContent}" var="tblEntry"
                      styleClass="table" headerClass="tableHeader"
                      rowClasses="tableRowOdd,tableRowEven"
                      first="#{allCustomers.currentRows}" rows="#{allCustomers.maxTblRows}"
                      cellpadding="3">
            <h:column>
               <f:facet name="header">ID</f:facet>
               #{tblEntry.id}
            </h:column>
            <h:column>
               <f:facet name="header">Text</f:facet>
               #{tblEntry.firstname}
            </h:column>

            <f:facet name="footer">
               <h:panelGroup>
                  <h:commandButton value="Zurueck" action="#{allCustomers.zurueck}" rendered="#{allCustomers.displayZurueckBtn}" styleClass="footerBtn" />
                  <h:selectOneMenu value="#{allCustomers.selectedPage}">
                     <f:selectItems value="#{allCustomers.pages}" var="page" itemLabel="Seite #{page}" itemValue="#{page}" />
                     <f:ajax listener="#{allCustomers.pageChange}" render="@form"/>
                  </h:selectOneMenu>
                  <h:commandButton value="Weiter" action="#{allCustomers.weiter}" rendered="#{allCustomers.displayWeiterBtn}" styleClass="footerBtn" />
               </h:panelGroup>
            </f:facet>
         </h:dataTable>

      </h:form>

   </ui:define>
</ui:composition>
</html>
