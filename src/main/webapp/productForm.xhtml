<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:f="http://java.sun.com/jsf/core">

   <ui:composition template="Layouts/template.xhtml">
      <ui:define name="content">

         <h:form id="create-product-form">
            <fieldset>
               <legend>#{productForm.operation}</legend>

               <h:outputLabel for="name" value="Name" styleClass="form-label"/>
               <h:inputText id="name" value="#{productForm.name}" required="true" label="Name"
                            styleClass="form-input-text"
                            readonly="#{productForm.operation.equals('Delete Product') || productForm.operation.equals('Read Product')}"
                            disabled="#{productForm.operation.equals('Delete Product') || productForm.operation.equals('Read Product')}"
               />
               <br/><br/>

               <h:outputLabel for="price" value="Price  (&#8364;)" styleClass="form-label"/>
               <h:inputText id="price" value="#{productForm.price}" required="true" label="Name"
                            styleClass="form-input-text"
                            pt:type = "number" pt:step ="0.01"
                            readonly="#{productForm.operation.equals('Delete Product') || productForm.operation.equals('Read Product')}"
                            disabled="#{productForm.operation.equals('Delete Product') || productForm.operation.equals('Read Product')}"
               />
               <br/><br/>

               <h:outputLabel for="brandName" value="Brand Name" styleClass="form-label"/>
               <h:selectOneMenu id="brandName" value="#{productForm.brandName}"
                                readonly="#{productForm.operation.equals('Delete Product') || productForm.operation.equals('Read Product')}"
                                disabled="#{productForm.operation.equals('Delete Product') || productForm.operation.equals('Read Product')}">
                  <f:selectItems value="#{allBrands.brands}"/>
               </h:selectOneMenu>

               <br/><br/>

               <h:outputLabel for="modelYear" value="Model Year" styleClass="form-label"/>
               <h:inputText id="modelYear" value="#{productForm.modelYear}" required="true" label="Name"
                            styleClass="form-input-text"
                            readonly="#{productForm.operation.equals('Delete Product') || productForm.operation.equals('Read Product')}"
                            disabled="#{productForm.operation.equals('Delete Product') || productForm.operation.equals('Read Product')}"
               />
               <br/><br/>

               <h:outputLabel for="categoryName" value="Category Name" styleClass="form-label"/>
               <h:selectOneMenu id="categoryName" value="#{productForm.categoryName}"
                                readonly="#{productForm.operation.equals('Delete Product') || productForm.operation.equals('Read Product')}"
                                disabled="#{productForm.operation.equals('Delete Product') || productForm.operation.equals('Read Product')}">
                  <f:selectItems value="#{allCategories.categories}"/>
               </h:selectOneMenu>
<!--               <h:inputText id="categoryName" value="#{productForm.categoryName}" required="true" label="Name"-->
<!--                            styleClass="form-input-text"-->
<!--                            readonly="#{productForm.operation.equals('Delete Product') || productForm.operation.equals('Read Product')}"-->
<!--                            disabled="#{productForm.operation.equals('Delete Product') || productForm.operation.equals('Read Product')}"-->
<!--               />-->
               <br/><br/>

            </fieldset>
            <br/><br/>
            <h:commandButton id="reset"  value="Reset" action="#{productForm.submitForm()}"
                             style="width: 100%" pt:type="reset"
                             rendered="#{productForm.operation.equals('Create Product')}"
            />
            <br/><br/>

            <h:commandButton id="submit" type="submit" value="#{productForm.operation}" action="#{productForm.submitForm()}"
                             style="width: 100%"
                             rendered="#{!productForm.operation.equals('Read Product')}"
            />
            <br/><br/>

         </h:form>

      </ui:define>
   </ui:composition>
</html>
