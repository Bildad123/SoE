<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:jsf="http://xmlns.jcp.org/jsf"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

   <ui:composition template="Layouts/template.xhtml">
      <ui:define name="content">

         <h:form id="create-product-form">
            <fieldset>
               <legend>Create Product</legend>

               <h:outputLabel for="name" value="Name" styleClass="form-label"/>
               <h:inputText id="name" value="#{productForm.name}" required="true" label="Name"
                            styleClass="form-input-text"

               />
               <br/><br/>

               <h:outputLabel for="price" value="Price  (&#8364;)" styleClass="form-label"/>
               <input type="number" jsf:id="price"  id="price" jsf:value="#{productForm.price}" name="Price"  step="0.01" label="Price" class="form-input-text"/>
               <br/><br/>



            </fieldset>
            <br/><br/>
            <h:commandButton id="reset"  value="reset" action="#{productForm.submitForm()}"
                             style="width: 100%" pt:type="reset"/>
            <br/><br/>
            <h:commandButton id="submit" type="submit" value="create product" action="#{productForm.submitForm()}"
                             style="width: 100%"
            />
            <br/><br/>

         </h:form>

      </ui:define>
   </ui:composition>
</html>
