<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html 	xmlns="http://www.w3.org/1999/xhtml"
         xmlns:f="http://xmlns.jcp.org/jsf/core"
         xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
         xmlns:h = "http://xmlns.jcp.org/jsf/html"
         xmlns:jsf = "http://xmlns.jcp.org/jsf"
         xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
>

<ui:composition template="Layouts/template.xhtml">
    <ui:define name="content">
        <h:outputLabel style="font-size: small" id="qty">
            Order items for #{orderItems.customer.firstname}  #{orderItems.customer.lastname}
        </h:outputLabel><br></br>

            <h:panelGroup id="data-table-orderItems">
                <h:dataTable value="#{orderItems.orderItems}" var="oi"
                             id="orderItems-data-table"
                             styleClass="customers-table"
                             headerClass="customers-table-header"
                             rowClasses="customers-table-odd-row,customers-table-even-row"
                             cellspacing="15px"
                             cellpadding="15px"
                             style="text-align: left"
                             rendered="#{orderItems.orderItems.size() > 0}">

                    <h:column>
                        <f:facet name="header">Product</f:facet>
                        #{oi.product.name}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Price</f:facet>
                        #{oi.listPrice}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Quantity</f:facet>
                        #{oi.quantity}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Discount</f:facet>
                        #{oi.discount}
                    </h:column>

                </h:dataTable>
            </h:panelGroup>


    </ui:define>
</ui:composition>

</html>
